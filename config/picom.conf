# Picom liviano para Intel UHD 620.
# VSync y pantalla completa sin compositor; sin desenfoque.
backend = "glx";
vsync = true;
unredir-if-possible = true;
shadow = true;
shadow-radius = 7;
shadow-offset-x = -7;
shadow-offset-y = -7;
shadow-opacity = 0.35;
fading = false;
inactive-opacity = 1;
frame-opacity = 1;
detect-rounded-corners = true;
detect-client-opacity = true;
glx-no-stencil = true;
use-damage = true;
